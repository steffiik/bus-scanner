<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bus-Scanner</title><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#f3f3f3;color:#222;font-family:Arial,sans-serif}.container{max-width:650px;margin:auto}h1{text-align:center}.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0002}button,input{width:100%;border-radius:12px;padding:16px;font-size:18px;margin-top:10px}button{border:0;font-weight:bold}input{border:1px solid #bbb}button:disabled{opacity:.5}.green{background:#198754;color:white}.red{background:#dc3545;color:white}.blue{background:#0d6efd;color:white}.gray{background:#ddd;color:#222}#activationBox,#person,#manualBox,#cameraBox{display:none}#cameraBox{position:relative;background:black;border-radius:14px;overflow:hidden}video{display:block;width:100%}#overlay{position:absolute;left:15%;top:15%;width:70%;height:70%;border:4px solid #888;border-radius:12px;pointer-events:none}#overlay.found{border-color:#198754}#personName,#memberNumber,#status,#cameraMessage,#device{text-align:center}#personName{font-size:25px;font-weight:bold}#memberNumber{color:#666;margin-top:8px}#status{font-weight:bold}#debug{font-size:13px;text-align:center;color:#555}#duplicateWarning{display:none;position:fixed;z-index:9999;left:10px;right:10px;top:50%;transform:translateY(-50%);background:#dc3545;color:white;border-radius:18px;padding:30px 20px;text-align:center;box-shadow:0 8px 30px #0006;font-size:25px;font-weight:bold}</style></head>
<body><div id="duplicateWarning">🚨<br>BEREITS ERFASST!<br><small>Diese Person wurde heute bereits erfasst.</small></div>
<div class="container"><div id="activationBox" class="card"><h1>🔒 Bus-Scanner</h1><p>Dieses Gerät muss freigeschaltet werden.</p><label for="geraeteId">Geräte-ID</label><input id="geraeteId" placeholder="z. B. H01"><label for="activationCode">Freischaltcode</label><input id="activationCode" type="password" inputmode="numeric" placeholder="Freischaltcode"><button id="activateButton" class="green">🔓 Gerät freischalten</button><p id="activationStatus"></p></div>
<div id="authorizedBox" style="display:none"><h1>🚌 Bus-Scanner</h1><div class="card"><div id="cameraMessage">Kamera noch nicht gestartet.</div><button id="startCamera" class="green">📷 Kamera starten</button><div id="cameraBox"><video id="video" autoplay muted playsinline></video><div id="overlay"></div></div></div>
<div class="card" id="manualEntryCard"><button id="manualStart" class="gray">✍️ Person ohne QR-Code erfassen</button><div id="manualBox"><label for="manualName">Vor- und Nachname</label><input id="manualName" type="text" maxlength="250" autocomplete="off" placeholder="z. B. Max Mustermann"><button id="manualContinue" class="blue">Weiter zur Bus-Auswahl</button><button id="manualCancel" class="gray">Abbrechen</button></div></div>
<div id="person" class="card"><div id="personName"></div><div id="memberNumber"></div><button id="busYes" class="green">Mit dem Bus gefahren</button><button id="busNo" class="red">Nicht mit dem Bus gefahren</button><button id="personCancel" class="gray">Abbrechen</button></div>
<div class="card"><div id="status">Bitte Kamera starten.</div></div><div class="card"><button id="exportToday" class="blue">📊 Tagesabschluss / Excel</button></div><div class="card" id="device">Gerät: <span id="deviceName"></span><button id="changeDevice" class="gray" style="font-size:14px">Freischaltung zurücksetzen</button></div><div id="transferInfo" class="card" aria-live="polite">📊 Bestätigt: <strong id="confirmedCount">0</strong> · ⏳ Offen: <strong id="pendingCount">0</strong> · ⚠️ Fehler: <strong id="failedCount">0</strong><br><small id="transferError"></small></div><div id="debug"></div></div></div>
<script>
const BACKEND_URL='https://script.google.com/macros/s/AKfycbxOoSLZAGBdLQs1MXeNvsLtgLY0yDi1FxMnx8cCNmTExS-w9SZrl2ylF_tLduIt0M9-zQ/exec';
const $=id=>document.getElementById(id),DEVICE_KEY='busScannerDeviceId',TOKEN_KEY='busScannerToken',NAME_KEY='busScannerDeviceName',QUEUE_KEY='busScannerOfflineQueue',SCANNED_KEY='busScannerScannedToday';
let stream=null,currentPerson=null,processing=false,scanning=false,scanGeneration=0,mode='qr',sending=false,syncing=false;
function setStatus(s){$('status').textContent=s}function getId(){return localStorage.getItem(DEVICE_KEY)||''}function getToken(){return localStorage.getItem(TOKEN_KEY)||''}function getName(){return localStorage.getItem(NAME_KEY)||'Unbekannt'}
function jsonp(action,params){return new Promise((resolve,reject)=>{const callback='busCb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),script=document.createElement('script');let finished=false;const timeout=setTimeout(()=>finish(new Error('Zeitüberschreitung')),15000);function finish(err,data){if(finished)return;finished=true;clearTimeout(timeout);delete window[callback];script.remove();err?reject(err):resolve(data)}window[callback]=data=>finish(null,data);script.onerror=()=>finish(new Error('Server nicht erreichbar'));script.src=BACKEND_URL+'?'+new URLSearchParams({aktion:action,...params,callback}).toString();document.body.appendChild(script)})}
function showActivation(message=''){stopScanner();$('activationBox').style.display='block';$('authorizedBox').style.display='none';$('activationStatus').textContent=message}
function showScanner(){$('activationBox').style.display='none';$('authorizedBox').style.display='block';$('deviceName').textContent=getName();updateQueueInfo()}
async function activate(){const id=$('geraeteId').value.trim(),code=$('activationCode').value.trim();if(!id||!code){$('activationStatus').textContent='Geräte-ID und Code eingeben.';return}$('activateButton').disabled=true;$('activationStatus').textContent='Freischaltung wird geprüft ...';try{const r=await jsonp('freischalten',{geraeteId:id,code});if(!r.success)throw new Error(r.message||'Freischaltung fehlgeschlagen');localStorage.setItem(DEVICE_KEY,r.geraeteId);localStorage.setItem(TOKEN_KEY,r.token);localStorage.setItem(NAME_KEY,r.geraet);showScanner();syncOfflineQueue()}catch(e){$('activationStatus').textContent='❌ '+e.message}finally{$('activateButton').disabled=false}}
async function checkAuthorization(){if(!getId()||!getToken()){showActivation();return false}try{const r=await jsonp('pruefen',{geraeteId:getId(),token:getToken()});if(!r.success){showActivation('⛔ Gerät gesperrt oder Freischaltung ungültig.');return false}if(r.geraet)localStorage.setItem(NAME_KEY,r.geraet);showScanner();return true}catch(e){showScanner();setStatus('⚠️ Freigabe derzeit nicht überprüfbar. Scans werden bei Bedarf offline gespeichert.');return true}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function readArray(key){try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}function writeArray(key,arr){localStorage.setItem(key,JSON.stringify(arr))}
function wasScannedToday(member){return readArray(SCANNED_KEY).some(x=>x.datum===today()&&String(x.mitgliedsnummer)===String(member))}
function markScannedToday(member){if(wasScannedToday(member))return;const a=readArray(SCANNED_KEY);a.push({datum:today(),mitgliedsnummer:String(member)});writeArray(SCANNED_KEY,a)}
function newScanId(){return crypto.randomUUID()}
function queueScan(data){
  const q=readArray(QUEUE_KEY);
  if(data.typ!=='manuell'&&q.some(x=>x.datum===today()&&String(x.mitgliedsnummer)===String(data.mitgliedsnummer)))return false;
  q.push({...data,scanId:newScanId(),datum:today(),erstellt:new Date().toISOString(),state:'pending',attempts:0});
  writeArray(QUEUE_KEY,q);updateQueueInfo();return true;
}
function updateQueueInfo(){
  const q=readArray(QUEUE_KEY),failed=q.filter(x=>x.state==='failed').length;
  $('pendingCount').textContent=q.length-failed;
  $('failedCount').textContent=failed;
  $('confirmedCount').textContent=Number(localStorage.getItem('busScannerConfirmedCount')||0);
  $('transferError').textContent=failed?'Bitte Übertragungsfehler prüfen.':'';
  $('debug').textContent=q.length?'⏳ '+q.length+' Eintrag/Einträge noch nicht bestätigt.':'';
}
async function sendToBackend(data){
  const p=new URLSearchParams();for(const [k,v] of Object.entries(data))if(v!==undefined&&v!==null)p.append(k,String(v));
  try{await fetch(BACKEND_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:p.toString()});return true}
  catch(e){console.error(e);return false}
}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function getServerReceipt(item){return jsonp('beleg',{scanId:item.scanId,geraeteId:item.geraeteId,token:item.token})}
async function syncOfflineQueue(){
  if(syncing||!navigator.onLine||!getToken())return;
  syncing=true;
  try{
    const q=readArray(QUEUE_KEY);
    for(const item of q){
      if(item.state==='failed')continue;
      if(!navigator.onLine)break;
      let receipt;
      try{receipt=await getServerReceipt(item)}catch(e){receipt=null}
      if(!receipt || !receipt.confirmed){
        if(!await sendToBackend(item))break;
        for(let n=0;n<4;n++){
          await wait(1100*(n+1));
          try{receipt=await getServerReceipt(item);if(receipt.confirmed)break}catch(e){}
        }
      }
      if(receipt&&receipt.confirmed){
        if(receipt.success){
          const count=Number(localStorage.getItem('busScannerConfirmedCount')||0)+1;
          localStorage.setItem('busScannerConfirmedCount',String(count));
          const idx=readArray(QUEUE_KEY).findIndex(x=>x.scanId===item.scanId);
          if(idx>=0){const current=readArray(QUEUE_KEY);current.splice(idx,1);writeArray(QUEUE_KEY,current)}
          setStatus('✅ Speicherung im Google Sheet bestätigt.');
        }else{
          const current=readArray(QUEUE_KEY),entry=current.find(x=>x.scanId===item.scanId);
          if(entry){entry.state='failed';entry.error=receipt.message;writeArray(QUEUE_KEY,current)}
          setStatus('⚠️ '+receipt.message);
          $('transferError').textContent=receipt.message;
          if(receipt.unauthorized){showActivation('⛔ Gerät gesperrt.');break}
        }
      }else{setStatus('⏳ Noch keine Serverbestätigung – Eintrag bleibt gespeichert.');break}
      updateQueueInfo();
    }
  }finally{syncing=false;updateQueueInfo()}
}
function parseQrCode(text){const r={};text.split(';').forEach(part=>{const i=part.indexOf('=');if(i>=0)r[part.slice(0,i).trim()]=part.slice(i+1).trim()});if(!r.Mitgliedsnummer)throw new Error('Mitgliedsnummer fehlt');return {typ:'qr',mitgliedsnummer:r.Mitgliedsnummer,vorname:r.Vorname||'',nachname:r.Nachname||'',kuerzel:r.Kuerzel||''}}
function showPerson(person){currentPerson=person;processing=true;stopScanner();$('personName').textContent=person.typ==='manuell'?person.manuellerName:(person.vorname+' '+person.nachname).trim();$('memberNumber').textContent=person.typ==='manuell'?'✍️ Manuelle Erfassung – später zuordnen':'Mitgliedsnummer: '+person.mitgliedsnummer;$('person').style.display='block';$('cameraBox').style.display='none';$('manualBox').style.display='none';$('manualStart').disabled=true;setStatus('Bitte Bus-Auswahl treffen.')}
function duplicateWarning(){$('duplicateWarning').style.display='block';setTimeout(()=>{$('duplicateWarning').style.display='none';processing=false;startScanner()},3000)}
function qrDetected(text){if(processing||mode!=='qr')return;try{const p=parseQrCode(text);if(wasScannedToday(p.mitgliedsnummer)){processing=true;stopScanner();duplicateWarning();return}showPerson(p)}catch(e){$('debug').textContent='QR erkannt, Format unbekannt.';requestAnimationFrame(()=>scanFrame())}}
const video=$('video');let canvas=null,context=null;
async function startCamera(){if(!getToken())return showActivation('Bitte zuerst freischalten.');$('startCamera').disabled=true;$('cameraMessage').textContent='Kamera wird gestartet ...';try{if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});video.srcObject=stream;await video.play()}$('cameraBox').style.display='block';$('cameraMessage').textContent='QR-Code vor die Kamera halten';mode='qr';startScanner()}catch(e){$('startCamera').disabled=false;setStatus('Kamera konnte nicht gestartet werden: '+e.message)}}
function stopScanner(){scanning=false;scanGeneration++}
function startScanner(){if(!stream||processing||mode!=='qr')return;if(!window.jsQR){setStatus('jsQR wurde nicht geladen.');return}if(scanning)return;scanning=true;const gen=++scanGeneration;if(!canvas){canvas=document.createElement('canvas');context=canvas.getContext('2d',{willReadFrequently:true})}setStatus('Scanner bereit.');requestAnimationFrame(()=>scanFrame(gen))}
function scanFrame(gen=scanGeneration){if(!scanning||processing||mode!=='qr'||gen!==scanGeneration)return;if(video.readyState>=video.HAVE_ENOUGH_DATA&&video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight;context.drawImage(video,0,0,canvas.width,canvas.height);const image=context.getImageData(0,0,canvas.width,canvas.height),code=jsQR(image.data,image.width,image.height,{inversionAttempts:'attemptBoth'});if(code&&code.data){qrDetected(code.data);return}}requestAnimationFrame(()=>scanFrame(gen))}
function finishScan(){currentPerson=null;processing=false;sending=false;$('busYes').disabled=false;$('busNo').disabled=false;$('person').style.display='none';$('manualStart').disabled=false;if(mode==='manuell'){mode='qr';$('manualName').value=''}$('cameraBox').style.display=stream?'block':'none';startScanner()}
async function saveScan(bus){
  if(!currentPerson||sending)return;
  sending=true;$('busYes').disabled=true;$('busNo').disabled=true;
  const p=currentPerson;
  const data={typ:p.typ,mitgliedsnummer:p.mitgliedsnummer||'',vorname:p.vorname||'',nachname:p.nachname||'',kuerzel:p.kuerzel||'',manuellerName:p.manuellerName||'',bus,geraet:getName(),geraeteId:getId(),token:getToken()};
  const queued=queueScan(data);
  if(queued&&p.typ!=='manuell')markScannedToday(p.mitgliedsnummer);
  finishScan();
  setStatus(queued?'📱 Lokal gesichert – Übertragung und Bestätigung laufen im Hintergrund.':'⚠️ Person auf diesem Handy bereits erfasst.');
  if(queued)syncOfflineQueue();
}
function startManual(){if(processing)return;mode='manuell';stopScanner();$('manualBox').style.display='block';$('manualName').focus();setStatus('Bitte Namen eingeben.')}
function cancelManual(){mode='qr';$('manualBox').style.display='none';$('manualName').value='';startScanner()}
function continueManual(){const name=$('manualName').value.trim();if(!name){setStatus('Bitte einen Namen eingeben.');return}showPerson({typ:'manuell',manuellerName:name})}
$('activateButton').addEventListener('click',activate);$('startCamera').addEventListener('click',startCamera);$('manualStart').addEventListener('click',startManual);$('manualContinue').addEventListener('click',continueManual);$('manualCancel').addEventListener('click',cancelManual);$('busYes').addEventListener('click',()=>saveScan('Ja'));$('busNo').addEventListener('click',()=>saveScan('Nein'));$('personCancel').addEventListener('click',finishScan);
$('exportToday').addEventListener('click',()=>{const p=new URLSearchParams({aktion:'tagesabschluss',geraeteId:getId(),token:getToken()});window.open(BACKEND_URL+'?'+p.toString(),'_blank')});
$('changeDevice').addEventListener('click',()=>{if(readArray(QUEUE_KEY).length){alert('Es gibt noch nicht übertragene Einträge. Bitte zuerst synchronisieren.');return}if(confirm('Freischaltung auf diesem Gerät zurücksetzen?')){localStorage.removeItem(DEVICE_KEY);localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(NAME_KEY);showActivation()}});
window.addEventListener('online',async()=>{await checkAuthorization();syncOfflineQueue()});
(async()=>{const ok=await checkAuthorization();if(ok)syncOfflineQueue()})();
setInterval(()=>{if(navigator.onLine)syncOfflineQueue()},30000);
updateQueueInfo();
</script></body></html>
