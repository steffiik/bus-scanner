<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Bus-Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  background: #f3f3f3;
  color: #222;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
}

h1 {
  text-align: center;
  margin: 8px 0 15px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 18px;
  margin-top: 12px;
  font-size: 19px;
  font-weight: bold;
}

#activationBox {
  max-width: 500px;
  margin: 40px auto;
}

#activationBox input {
  width: 100%;
  padding: 16px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 20px;
  margin-top: 8px;
  text-align: center;
}

#activateButton {
  background: #198754;
  color: white;
}

#activationStatus {
  text-align: center;
  font-weight: bold;
  margin-top: 15px;
}

#authorizedBox {
  display: none;
}

#cameraBox {
  display: none;
  position: relative;
  background: black;
  border-radius: 14px;
  overflow: hidden;
}

#video {
  display: block;
  width: 100%;
  height: auto;
}

#overlay {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 70%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border: 4px solid #888;
  border-radius: 12px;
  pointer-events: none;
}

#overlay.found {
  border-color: #198754;
}

#cameraMessage {
  text-align: center;
  padding: 12px;
  font-weight: bold;
}

#startCamera {
  background: #198754;
  color: white;
}

#person {
  display: none;
}

#personName {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  margin-bottom: 8px;
}

#memberNumber {
  text-align: center;
  color: #666;
  margin-bottom: 20px;
}

#busYes {
  background: #198754;
  color: white;
}

#busNo {
  background: #dc3545;
  color: white;
}

#changeDevice {
  background: #ddd;
  color: #222;
  font-size: 14px;
  padding: 10px;
}

#status {
  text-align: center;
  font-weight: bold;
  min-height: 24px;
}

#device {
  text-align: center;
  color: #666;
  font-size: 14px;
}

#debug {
  margin-top: 10px;
  text-align: center;
  font-size: 12px;
  color: #777;
}

#duplicateWarning {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 10px;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: #dc3545;
  color: white;
  border-radius: 18px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.35);
}

#duplicateWarning .warningIcon {
  font-size: 55px;
  margin-bottom: 10px;
}

#duplicateWarning .warningTitle {
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 10px;
}

#duplicateWarning .warningText {
  font-size: 20px;
  font-weight: bold;
}

</style>

</head>

<body>


<!-- =========================================
     DOPPEL-SCAN WARNUNG
========================================= -->

<div id="duplicateWarning">

  <div class="warningIcon">
    🚨
  </div>

  <div class="warningTitle">
    BEREITS ERFASST!
  </div>

  <div class="warningText">
    Diese Person wurde heute<br>
    bereits erfasst.
  </div>

</div>


<!-- =========================================
     FREISCHALTUNG
========================================= -->

<div
  id="activationBox"
  class="card"
>

  <h1>🔒 Bus-Scanner</h1>

  <p style="text-align:center;">
    Dieses Gerät muss zuerst freigeschaltet werden.
  </p>

  <label>
    Geräte-ID
  </label>

  <input
    id="geraeteId"
    type="text"
    placeholder="z. B. H01"
    autocomplete="off"
  >

  <label
    style="
      display:block;
      margin-top:15px;
    "
  >
    Freischaltcode
  </label>

  <input
    id="activationCode"
    type="password"
    inputmode="numeric"
    placeholder="6-stelliger Code"
    autocomplete="off"
  >

  <button
    id="activateButton"
  >
    🔓 Gerät freischalten
  </button>

  <div id="activationStatus"></div>

</div>


<!-- =========================================
     GESAMTER SCANNER
========================================= -->

<div
  id="authorizedBox"
  class="container"
>

  <h1>🚌 Bus-Scanner</h1>


  <div class="card">

    <div id="cameraMessage">
      Kamera noch nicht gestartet.
    </div>

    <button id="startCamera">
      📷 Kamera starten
    </button>

    <div id="cameraBox">

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>

      <div id="overlay"></div>

    </div>

  </div>


  <div
    id="person"
    class="card"
  >

    <div id="personName"></div>

    <div id="memberNumber"></div>

    <button id="busYes">
      Mit dem Bus gefahren
    </button>

    <button id="busNo">
      Nicht mit dem Bus gefahren
    </button>

  </div>


  <div class="card">

    <div id="status">
      Bitte Kamera starten.
    </div>

  </div>


  <div class="card">

    <button
      id="exportToday"
      style="
        background:#0d6efd;
        color:white;
        font-size:17px;
      "
    >
      📊 Tagesabschluss / Excel
    </button>

  </div>


  <div
    id="device"
    class="card"
  >

    Gerät:
    <span id="deviceName"></span>

    <button id="changeDevice">
      Gerät ändern
    </button>

  </div>


  <div id="debug"></div>

</div>


<script>


/* =========================================
   BACKEND
========================================= */

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbxOoSLZAGBdLQs1MXeNvsLtgLY0yDi1FxMnx8cCNmTExS-w9SZrl2ylF_tLduIt0M9-zQ/exec";


/* =========================================
   ELEMENTE
========================================= */

const video =
  document.getElementById("video");

const cameraBox =
  document.getElementById("cameraBox");

const cameraMessage =
  document.getElementById("cameraMessage");

const startCameraButton =
  document.getElementById("startCamera");

const overlay =
  document.getElementById("overlay");

const status =
  document.getElementById("status");

const debug =
  document.getElementById("debug");

const personBox =
  document.getElementById("person");


/* =========================================
   FREISCHALTUNG
========================================= */

const DEVICE_KEY =
  "busScannerDeviceId";

const TOKEN_KEY =
  "busScannerToken";

const DEVICE_NAME_KEY =
  "busScannerDeviceName";


function getStoredDeviceId() {

  return localStorage.getItem(
    DEVICE_KEY
  ) || "";

}


function getStoredToken() {

  return localStorage.getItem(
    TOKEN_KEY
  ) || "";

}


function saveAuthorization(
  geraeteId,
  geraet,
  token
) {

  localStorage.setItem(
    DEVICE_KEY,
    geraeteId
  );

  localStorage.setItem(
    DEVICE_NAME_KEY,
    geraet
  );

  localStorage.setItem(
    TOKEN_KEY,
    token
  );

}


function clearAuthorization() {

  localStorage.removeItem(
    DEVICE_KEY
  );

  localStorage.removeItem(
    DEVICE_NAME_KEY
  );

  localStorage.removeItem(
    TOKEN_KEY
  );

}


function showActivationBox() {

  document
    .getElementById(
      "activationBox"
    )
    .style.display =
    "block";

  document
    .getElementById(
      "authorizedBox"
    )
    .style.display =
    "none";

}


function showScanner() {

  document
    .getElementById(
      "activationBox"
    )
    .style.display =
    "none";

  document
    .getElementById(
      "authorizedBox"
    )
    .style.display =
    "block";

  showDeviceName();

}


/* =========================================
   JSONP FREISCHALTUNG
========================================= */

function activateDevice() {

  const geraeteId =
    document
      .getElementById(
        "geraeteId"
      )
      .value
      .trim();

  const code =
    document
      .getElementById(
        "activationCode"
      )
      .value
      .trim();

  const activationStatus =
    document
      .getElementById(
        "activationStatus"
      );


  if (!geraeteId) {

    activationStatus.textContent =
      "Bitte Geräte-ID eingeben.";

    return;

  }


  if (!code) {

    activationStatus.textContent =
      "Bitte Freischaltcode eingeben.";

    return;

  }


  activationStatus.textContent =
    "⏳ Freischaltung wird geprüft ...";


  const callbackName =
    "activationCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      try {

        if (
          result &&
          result.success
        ) {

          saveAuthorization(

            result.geraeteId,

            result.geraet,

            result.token

          );


          activationStatus.textContent =
            "✅ Gerät erfolgreich freigeschaltet.";

          showScanner();


        } else {

          activationStatus.textContent =
            "❌ " +
            (
              result.message ||
              "Freischaltung fehlgeschlagen."
            );

        }

      } finally {

        delete window[
          callbackName
        ];

        if (script.parentNode) {

          script.parentNode.removeChild(
            script
          );

        }

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    BACKEND_URL +
    "?aktion=freischalten" +
    "&geraeteId=" +
    encodeURIComponent(
      geraeteId
    ) +
    "&code=" +
    encodeURIComponent(
      code
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      activationStatus.textContent =
        "❌ Server nicht erreichbar.";

      delete window[
        callbackName
      ];

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }

    };


  document
    .body
    .appendChild(
      script
    );

}


document
  .getElementById(
    "activateButton"
  )
  .addEventListener(
    "click",
    activateDevice
  );


/* =========================================
   GERÄT
========================================= */

function getDeviceName() {

  return (
    localStorage.getItem(
      DEVICE_NAME_KEY
    ) ||
    "Unbekannt"
  );

}


function showDeviceName() {

  document
    .getElementById(
      "deviceName"
    )
    .textContent =
    getDeviceName();

}


/* =========================================
   DUPLIKATE AUF DIESEM HANDY
========================================= */

const SCANNED_TODAY_KEY =
  "busScannerScannedToday";


function getScannedToday() {

  try {

    const saved =
      localStorage.getItem(
        SCANNED_TODAY_KEY
      );

    if (!saved) {
      return [];
    }

    const data =
      JSON.parse(saved);

    if (!Array.isArray(data)) {
      return [];
    }

    return data;

  } catch (error) {

    return [];

  }

}


function saveScannedToday(
  data
) {

  localStorage.setItem(
    SCANNED_TODAY_KEY,
    JSON.stringify(data)
  );

}


function getTodayString() {

  const now =
    new Date();

  return (
    now.getFullYear() +
    "-" +
    String(
      now.getMonth() + 1
    ).padStart(2, "0") +
    "-" +
    String(
      now.getDate()
    ).padStart(2, "0")
  );

}


function wasScannedToday(
  memberNumber
) {

  const today =
    getTodayString();

  const data =
    getScannedToday();

  return data.some(
    function(item) {

      return (
        item.datum === today &&
        String(
          item.mitgliedsnummer
        ) ===
        String(memberNumber)
      );

    }
  );

}


function markScannedToday(
  memberNumber
) {

  const data =
    getScannedToday();

  const today =
    getTodayString();


  if (
    wasScannedToday(
      memberNumber
    )
  ) {

    return;

  }


  data.push({

    datum:
      today,

    mitgliedsnummer:
      String(memberNumber)

  });


  saveScannedToday(
    data
  );

}


/* =========================================
   OFFLINE-SPEICHER
========================================= */

const QUEUE_KEY =
  "busScannerOfflineQueue";


function getOfflineQueue() {

  try {

    const saved =
      localStorage.getItem(
        QUEUE_KEY
      );

    if (!saved) {
      return [];
    }

    const queue =
      JSON.parse(saved);

    if (!Array.isArray(queue)) {
      return [];
    }

    return queue;

  } catch (error) {

    return [];

  }

}


function saveOfflineQueue(
  queue
) {

  localStorage.setItem(
    QUEUE_KEY,
    JSON.stringify(queue)
  );

}


function isAlreadyQueuedToday(
  memberNumber
) {

  const queue =
    getOfflineQueue();

  const today =
    getTodayString();


  return queue.some(
    function(item) {

      return (
        item.datum === today &&
        String(
          item.mitgliedsnummer
        ) ===
        String(memberNumber)
      );

    }
  );

}


function addToOfflineQueue(
  data
) {

  const queue =
    getOfflineQueue();


  if (
    isAlreadyQueuedToday(
      data.mitgliedsnummer
    )
  ) {

    return false;

  }


  queue.push({

    datum:
      getTodayString(),

    erstellt:
      new Date().toISOString(),

    mitgliedsnummer:
      data.mitgliedsnummer,

    vorname:
      data.vorname,

    nachname:
      data.nachname,

    kuerzel:
      data.kuerzel,

    bus:
      data.bus,

    geraet:
      data.geraet,

    geraeteId:
      data.geraeteId,

    token:
      data.token

  });


  saveOfflineQueue(
    queue
  );

  return true;

}


function updateOfflineInfo() {

  const queue =
    getOfflineQueue();

  const count =
    queue.length;


  if (count > 0) {

    debug.textContent =
      "⏳ " +
      count +
      " Scan(s) warten auf Übertragung.";

  } else {

    debug.textContent =
      "";

  }

}


/* =========================================
   OFFLINE SYNCHRONISIEREN
========================================= */

async function syncOfflineQueue() {

  const queue =
    getOfflineQueue();


  if (
    queue.length === 0
  ) {

    updateOfflineInfo();
    return;

  }


  if (
    navigator.onLine === false
  ) {

    updateOfflineInfo();
    return;

  }


  setStatus(
    "⏳ Gespeicherte Scans werden übertragen ..."
  );


  const remaining = [];


  for (
    let i = 0;
    i < queue.length;
    i++
  ) {

    const item =
      queue[i];


    const success =
      await sendToBackend(
        item
      );


    if (!success) {

      remaining.push(
        item
      );

    }

  }


  saveOfflineQueue(
    remaining
  );


  updateOfflineInfo();


  if (
    remaining.length === 0
  ) {

    setStatus(
      "✅ Alle gespeicherten Scans wurden übertragen."
    );

  } else {

    setStatus(
      "📶 " +
      remaining.length +
      " Scan(s) warten noch auf Internet."
    );

  }

}


/* =========================================
   STATUS
========================================= */

function setStatus(text) {

  status.textContent =
    text;

}


/* =========================================
   QR PARSEN
========================================= */

function parseQrCode(text) {

  const result = {};


  text
    .split(";")
    .forEach(
      function(part) {

        const index =
          part.indexOf("=");

        if (index === -1) {
          return;
        }


        const key =
          part
            .substring(
              0,
              index
            )
            .trim();


        const value =
          part
            .substring(
              index + 1
            )
            .trim();


        result[key] =
          value;

      }
    );


  if (
    !result.Mitgliedsnummer
  ) {

    throw new Error(
      "Mitgliedsnummer fehlt."
    );

  }


  return {

    mitgliedsnummer:
      result.Mitgliedsnummer,

    vorname:
      result.Vorname || "",

    nachname:
      result.Nachname || "",

    kuerzel:
      result.Kuerzel || ""

  };

}


/* =========================================
   DUPLIKAT-WARNUNG
========================================= */

function showDuplicateWarning() {

  document
    .getElementById(
      "duplicateWarning"
    )
    .style.display =
    "block";

}


function hideDuplicateWarning() {

  document
    .getElementById(
      "duplicateWarning"
    )
    .style.display =
    "none";

}


/* =========================================
   QR ERKANNT
========================================= */

function qrDetected(text) {

  if (
    processing ||
    !text
  ) {

    return;

  }


  try {

    const person =
      parseQrCode(text);


    if (
      wasScannedToday(
        person.mitgliedsnummer
      )
    ) {

      processing =
        true;

      stopScanner();


      overlay.classList.add(
        "found"
      );


      showDuplicateWarning();


      setTimeout(
        function() {

          hideDuplicateWarning();

          overlay.classList.remove(
            "found"
          );

          processing =
            false;

          setStatus(
            "Scanner bereit."
          );

          startScanner();

        },
        3000
      );


      return;

    }


    processing =
      true;

    stopScanner();


    overlay.classList.add(
      "found"
    );


    currentPerson =
      person;


    document
      .getElementById(
        "personName"
      )
      .textContent =
      (
        person.vorname +
        " " +
        person.nachname
      ).trim();


    document
      .getElementById(
        "memberNumber"
      )
      .textContent =
      "Mitgliedsnummer: " +
      person.mitgliedsnummer;


    personBox.style.display =
      "block";


    cameraBox.style.display =
      "none";


    setStatus(
      "Bitte Bus-Auswahl treffen."
    );


  } catch (error) {

    console.error(
      error
    );

    debug.textContent =
      "QR erkannt, Format unbekannt.";

  }

}


/* =========================================
   KAMERA
========================================= */

let stream = null;

let currentPerson = null;

let processing = false;

let scanning = false;


async function startCamera() {

  startCameraButton.disabled =
    true;


  cameraMessage.textContent =
    "Kamera wird gestartet ...";


  setStatus(
    "Kamera wird geöffnet ..."
  );


  try {

    const mediaDevices =
      navigator.mediaDevices;


    if (
      !mediaDevices ||
      !mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Kamera wird von diesem Browser nicht unterstützt."
      );

    }


    stream =
      await mediaDevices.getUserMedia({

        video: {

          facingMode:
            "environment"

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    cameraBox.style.display =
      "block";


    cameraMessage.textContent =
      "QR-Code vor die Kamera halten";


    setStatus(
      "Kamera läuft – Scanner wird gestartet ..."
    );


    debug.textContent =
      "Kamera erfolgreich geöffnet";


    await startScanner();


  } catch (error) {

    console.error(
      error
    );


    startCameraButton.disabled =
      false;


    cameraMessage.textContent =
      "Kamera konnte nicht gestartet werden.";


    setStatus(
      "Fehler: " +
      error.name
    );


    debug.textContent =
      error.message;

  }

}


/* =========================================
   QR SCANNER
========================================= */

function startScanner() {

  try {

    if (!window.jsQR) {

      throw new Error(
        "jsQR wurde nicht geladen."
      );

    }


    const canvas =
      document.createElement(
        "canvas"
      );


    const context =
      canvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );


    scanning =
      true;


    setStatus(
      "Scanner bereit."
    );


    debug.textContent =
      "QR-Scanner läuft";


    function scanFrame() {

      if (
        !scanning ||
        processing
      ) {

        return;

      }


      if (
        video.readyState <
        video.HAVE_ENOUGH_DATA
      ) {

        requestAnimationFrame(
          scanFrame
        );

        return;

      }


      const width =
        video.videoWidth;

      const height =
        video.videoHeight;


      if (
        width === 0 ||
        height === 0
      ) {

        requestAnimationFrame(
          scanFrame
        );

        return;

      }


      canvas.width =
        width;

      canvas.height =
        height;


      context.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      const imageData =
        context.getImageData(
          0,
          0,
          width,
          height
        );


      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      if (
        code &&
        code.data
      ) {

        qrDetected(
          code.data
        );

        return;

      }


      requestAnimationFrame(
        scanFrame
      );

    }


    scanFrame();


  } catch (error) {

    console.error(
      error
    );


    setStatus(
      "QR-Scanner konnte nicht gestartet werden."
    );


    debug.textContent =
      "Scannerfehler: " +
      error.message;

  }

}


/* =========================================
   SCANNER STOPPEN
========================================= */

function stopScanner() {

  scanning =
    false;

}


/* =========================================
   BACKEND
========================================= */

async function sendToBackend(
  data
) {

  try {

    const params =
      new URLSearchParams();


    params.append(
      "mitgliedsnummer",
      data.mitgliedsnummer
    );


    params.append(
      "vorname",
      data.vorname
    );


    params.append(
      "nachname",
      data.nachname
    );


    params.append(
      "kuerzel",
      data.kuerzel
    );


    params.append(
      "bus",
      data.bus
    );


    params.append(
      "geraet",
      data.geraet
    );


    params.append(
      "geraeteId",
      data.geraeteId ||
      getStoredDeviceId()
    );


    params.append(
      "token",
      data.token ||
      getStoredToken()
    );


    await fetch(
      BACKEND_URL,
      {

        method:
          "POST",

        mode:
          "no-cors",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body:
          params.toString()

      }
    );


    return true;


  } catch (error) {

    console.error(
      "Übertragung fehlgeschlagen:",
      error
    );


    return false;

  }

}


/* =========================================
   SCAN SPEICHERN
========================================= */

async function saveScan(
  busValue
) {

  if (!currentPerson) {
    return;
  }


  const data = {

    mitgliedsnummer:
      currentPerson.mitgliedsnummer,

    vorname:
      currentPerson.vorname,

    nachname:
      currentPerson.nachname,

    kuerzel:
      currentPerson.kuerzel,

    bus:
      busValue,

    geraet:
      getDeviceName(),

    geraeteId:
      getStoredDeviceId(),

    token:
      getStoredToken()

  };


  setStatus(
    "Scan wird gespeichert ..."
  );


  if (
    navigator.onLine === false
  ) {

    const added =
      addToOfflineQueue(
        data
      );


    if (added) {

      markScannedToday(
        data.mitgliedsnummer
      );


      setStatus(
        "📱 Kein Internet – Scan wurde auf diesem Handy gespeichert."
      );

    } else {

      setStatus(
        "⚠️ Diese Person wurde heute bereits erfasst."
      );

    }


    updateOfflineInfo();

    finishScan();

    return;

  }


  const success =
    await sendToBackend(
      data
    );


  if (success) {

    markScannedToday(
      data.mitgliedsnummer
    );


    setStatus(
      "✅ Scan gespeichert."
    );

  } else {

    const added =
      addToOfflineQueue(
        data
      );


    if (added) {

      markScannedToday(
        data.mitgliedsnummer
      );


      setStatus(
        "📱 Internet nicht erreichbar – Scan wurde gespeichert und wird später übertragen."
      );

    } else {

      setStatus(
        "⚠️ Diese Person wurde heute bereits erfasst."
      );

    }

  }


  updateOfflineInfo();

  finishScan();

}


/* =========================================
   SCAN ABSCHLIESSEN
========================================= */

function finishScan() {

  currentPerson =
    null;


  personBox.style.display =
    "none";


  cameraBox.style.display =
    "block";


  overlay.classList.remove(
    "found"
  );


  processing =
    false;


  startScanner();

}

========================================= */

  const url =
    BACKEND_URL +

  window.open(

    "_blank"
  );

}

document

/* =========================================
   INTERNET
========================================= */

window.addEventListener(
  "online",
  function() {

    setStatus(
      "📶 Internet wieder da – Übertragung wird gestartet ..."
    );


    syncOfflineQueue();

  }
);


/* =========================================
   START
========================================= */

function initializeApp() {

  const deviceId =
    getStoredDeviceId();

  const token =
    getStoredToken();


  if (
    deviceId &&
    token
  ) {

    showScanner();

    updateOfflineInfo();


    if (
      navigator.onLine
    ) {

      syncOfflineQueue();

    }


  } else {

    showActivationBox();

  }

}


initializeApp();
