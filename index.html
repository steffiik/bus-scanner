<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bus-Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #f3f3f3;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 8px 0 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    #cameraBox {
      display: none;
      position: relative;
      background: black;
      border-radius: 14px;
      overflow: hidden;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
    }

    #overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 70%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 4px solid #888;
      border-radius: 12px;
      pointer-events: none;
    }

    #overlay.found {
      border-color: #198754;
    }

    #cameraMessage {
      text-align: center;
      padding: 12px;
      font-weight: bold;
    }

    #startCamera {
      background: #198754;
      color: white;
    }

    #person {
      display: none;
    }

    #personName {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #memberNumber {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 18px;
      margin-top: 12px;
      font-size: 19px;
      font-weight: bold;
    }

    #busYes {
      background: #198754;
      color: white;
    }

    #busNo {
      background: #dc3545;
      color: white;
    }

    #changeDevice {
      background: #ddd;
      color: #222;
      font-size: 14px;
      padding: 10px;
    }

    #status {
      text-align: center;
      font-weight: bold;
      min-height: 24px;
    }

    #device {
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    #debug {
      margin-top: 10px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>🚌 Bus-Scanner</h1>


  <div class="card">

    <div id="cameraMessage">
      Kamera noch nicht gestartet.
    </div>

    <button id="startCamera">
      📷 Kamera starten
    </button>


    <div id="cameraBox">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div id="overlay"></div>

    </div>

  </div>


  <div
    id="person"
    class="card">

    <div id="personName"></div>

    <div id="memberNumber"></div>


    <button id="busYes">
      Mit dem Bus gefahren
    </button>


    <button id="busNo">
      Nicht mit dem Bus gefahren
    </button>

  </div>


  <div class="card">

    <div id="status">
      Bitte Kamera starten.
    </div>

  </div>


  <div
    id="device"
    class="card">

    Gerät:
    <span id="deviceName"></span>

    <button id="changeDevice">
      Gerät ändern
    </button>

  </div>


  <div id="debug"></div>


</div>


<script>


/* =========================================
   BACKEND
========================================= */

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbxOoSLZAGBdLQs1MXeNvsLtgLY0yDi1FxMnx8cCNmTExS-w9SZrl2ylF_tLduIt0M9-zQ/exec";


/* =========================================
   ELEMENTE
========================================= */

const video =
  document.getElementById("video");

const cameraBox =
  document.getElementById("cameraBox");

const cameraMessage =
  document.getElementById("cameraMessage");

const startCameraButton =
  document.getElementById("startCamera");

const overlay =
  document.getElementById("overlay");

const status =
  document.getElementById("status");

const debug =
  document.getElementById("debug");

const personBox =
  document.getElementById("person");


/* =========================================
   VARIABLEN
========================================= */

let stream = null;



let currentPerson = null;

let processing = false;


/* =========================================
   GERÄT
========================================= */

function getDeviceName() {

  let name =
    localStorage.getItem(
      "busScannerDevice"
    );


  if (!name) {

    name =
      prompt(
        "Name dieses Geräts:",
        "Handy 1"
      );


    if (
      !name ||
      !name.trim()
    ) {

      name = "Unbekannt";

    }


    localStorage.setItem(
      "busScannerDevice",
      name.trim()
    );

  }


  return name;

}


function showDeviceName() {

  document.getElementById(
    "deviceName"
  ).textContent =
    getDeviceName();

}


/* =========================================
   STATUS
========================================= */

function setStatus(text) {

  status.textContent =
    text;

}


/* =========================================
   QR PARSEN
========================================= */

function parseQrCode(text) {

  const result = {};


  text
    .split(";")
    .forEach(function(part) {

      const index =
        part.indexOf("=");


      if (index === -1) {
        return;
      }


      const key =
        part
          .substring(0, index)
          .trim();


      const value =
        part
          .substring(index + 1)
          .trim();


      result[key] = value;

    });


  if (
    !result.Mitgliedsnummer
  ) {

    throw new Error(
      "Mitgliedsnummer fehlt."
    );

  }


  return {

    mitgliedsnummer:
      result.Mitgliedsnummer,

    vorname:
      result.Vorname || "",

    nachname:
      result.Nachname || "",

    kuerzel:
      result.Kuerzel || ""

  };

}


/* =========================================
   QR ERKANNT
========================================= */

function qrDetected(text) {

  if (
    processing ||
    !text
  ) {

    return;

  }


  try {

    const person =
      parseQrCode(text);


    processing = true;


    stopScanner();


    overlay.classList.add(
      "found"
    );


    currentPerson =
      person;


    document.getElementById(
      "personName"
    ).textContent =
      (
        person.vorname +
        " " +
        person.nachname
      ).trim();


    document.getElementById(
      "memberNumber"
    ).textContent =
      "Mitgliedsnummer: " +
      person.mitgliedsnummer;


    personBox.style.display =
      "block";


    cameraBox.style.display =
      "none";


    setStatus(
      "Bitte Bus-Auswahl treffen."
    );


  } catch (error) {

    debug.textContent =
      "QR erkannt, Format unbekannt.";

  }

}


/* =========================================
   KAMERA STARTEN
========================================= */

async function startCamera() {

  startCameraButton.disabled =
    true;


  cameraMessage.textContent =
    "Kamera wird gestartet ...";


  setStatus(
    "Kamera wird geöffnet ..."
  );


  try {

    const mediaDevices =
      navigator.mediaDevices;


    if (
      !mediaDevices ||
      !mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Kamera wird von diesem Browser nicht unterstützt."
      );

    }


    stream =
      await mediaDevices.getUserMedia({

        video: {

          facingMode: "environment"

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    cameraBox.style.display =
      "block";


    cameraMessage.textContent =
      "QR-Code vor die Kamera halten";


    setStatus(
      "Kamera läuft – Scanner wird gestartet ..."
    );


    debug.textContent =
      "Kamera erfolgreich geöffnet";


    await startScanner();


  } catch (error) {

    console.error(
      error
    );


    startCameraButton.disabled =
      false;


    cameraMessage.textContent =
      "Kamera konnte nicht gestartet werden.";


    setStatus(
      "Fehler: " +
      error.name
    );


    debug.textContent =
      error.message;

  }

}


/* =========================================
   QR SCANNER
========================================= */

function startScanner() {

  try {

    if (!window.jsQR) {

      throw new Error(
        "jsQR wurde nicht geladen."
      );

    }


    const canvas =
      document.createElement("canvas");

    const context =
      canvas.getContext("2d", {
        willReadFrequently: true
      });


    scanning = true;


    setStatus(
      "Scanner bereit."
    );


    debug.textContent =
      "QR-Scanner läuft";


    function scanFrame() {

      if (
        !scanning ||
        processing
      ) {

        return;

      }


      if (
        video.readyState <
        video.HAVE_ENOUGH_DATA
      ) {

        requestAnimationFrame(
          scanFrame
        );

        return;

      }


      /*
       * Kamerabild auf Canvas zeichnen.
       */

      const width =
        video.videoWidth;

      const height =
        video.videoHeight;


      if (
        width === 0 ||
        height === 0
      ) {

        requestAnimationFrame(
          scanFrame
        );

        return;

      }


      canvas.width =
        width;

      canvas.height =
        height;


      context.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      const imageData =
        context.getImageData(
          0,
          0,
          width,
          height
        );


      /*
       * QR-Code suchen.
       */

      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      if (
        code &&
        code.data
      ) {

        console.log(
          "QR-Code erkannt:",
          code.data
        );


        qrDetected(
          code.data
        );


        return;

      }


      /*
       * Nächsten Kameraframe prüfen.
       */

      requestAnimationFrame(
        scanFrame
      );

    }


    scanFrame();


  } catch (error) {

    console.error(
      error
    );


    setStatus(
      "QR-Scanner konnte nicht gestartet werden."
    );


    debug.textContent =
      "Scannerfehler: " +
      error.message;

  }

}

/* =========================================
   SCANNER STOPPEN
========================================= */

function stopScanner() {

  scanning = false;

}


/* =========================================
   AN BACKEND SENDEN
========================================= */

async function sendToBackend(data) {

  try {

    const params =
      new URLSearchParams();


    params.append(
      "mitgliedsnummer",
      data.mitgliedsnummer
    );


    params.append(
      "vorname",
      data.vorname
    );


    params.append(
      "nachname",
      data.nachname
    );


    params.append(
      "kuerzel",
      data.kuerzel
    );


    params.append(
      "bus",
      data.bus
    );


    params.append(
      "geraet",
      data.geraet
    );


    await fetch(
      BACKEND_URL,
      {

        method: "POST",

        mode: "no-cors",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body:
          params.toString()

      }
    );


    return true;


  } catch (error) {

    console.error(
      error
    );


    return false;

  }

}


/* =========================================
   SCAN SPEICHERN
========================================= */

async function saveScan(
  busValue
) {

  if (!currentPerson) {
    return;
  }


  setStatus(
    "Scan wird gespeichert ..."
  );


  const data = {

    mitgliedsnummer:
      currentPerson.mitgliedsnummer,

    vorname:
      currentPerson.vorname,

    nachname:
      currentPerson.nachname,

    kuerzel:
      currentPerson.kuerzel,

    bus:
      busValue,

    geraet:
      getDeviceName()

  };


  const success =
    await sendToBackend(
      data
    );


  if (success) {

    setStatus(
      "✅ Scan gespeichert."
    );

  } else {

    setStatus(
      "❌ Übertragung fehlgeschlagen."
    );

  }


  currentPerson =
    null;


  personBox.style.display =
    "none";


  cameraBox.style.display =
    "block";


  overlay.classList.remove(
    "found"
  );


  processing =
    false;


  startScanner();

}


/* =========================================
   BUTTONS
========================================= */

document
  .getElementById("busYes")
  .addEventListener(
    "click",
    function() {

      saveScan("Ja");

    }
  );


document
  .getElementById("busNo")
  .addEventListener(
    "click",
    function() {

      saveScan("Nein");

    }
  );


startCameraButton
  .addEventListener(
    "click",
    function() {

      startCamera();

    }
  );


document
  .getElementById("changeDevice")
  .addEventListener(
    "click",
    function() {

      const newName =
        prompt(
          "Name dieses Geräts:",
          getDeviceName()
        );


      if (
        newName &&
        newName.trim()
      ) {

        localStorage.setItem(
          "busScannerDevice",
          newName.trim()
        );


        showDeviceName();

      }

    }
  );


/* =========================================
   START
========================================= */

showDeviceName();

</script>


</body>

</html>
```
