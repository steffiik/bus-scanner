<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Bus-Scanner</title>

  <!-- ZXing: Fallback für Browser ohne BarcodeDetector -->
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #f3f3f3;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 8px 0 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    #cameraBox {
      position: relative;
      width: 100%;
      background: black;
      overflow: hidden;
      border-radius: 14px;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
    }

    #scanOverlay {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 72%;
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border: 4px solid #888;
      border-radius: 12px;
      pointer-events: none;
    }

    #scanOverlay.found {
      border-color: #198754;
    }

    #cameraMessage {
      text-align: center;
      padding: 12px;
      font-weight: bold;
    }

    #person {
      display: none;
    }

    #personName {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #memberNumber {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 18px;
      margin-top: 12px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    #busYes {
      background: #198754;
      color: white;
    }

    #busNo {
      background: #dc3545;
      color: white;
    }

    #restartButton {
      background: #444;
      color: white;
    }

    #changeDevice {
      background: #ddd;
      color: #222;
      font-size: 14px;
      padding: 10px;
    }

    #status {
      text-align: center;
      font-weight: bold;
      min-height: 24px;
    }

    #offlineInfo {
      display: none;
      background: #fff3cd;
      color: #664d03;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      margin-bottom: 12px;
    }

    #deviceSettings {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 12px;
    }

    #debug {
      margin-top: 10px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚌 Bus-Scanner</h1>

  <div id="offlineInfo">
    Keine Internetverbindung.<br>
    Die Erfassung wird gespeichert und später übertragen.
  </div>

  <div class="card">

    <div id="cameraBox">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div id="scanOverlay"></div>

    </div>

    <div id="cameraMessage">
      Kamera wird gestartet ...
    </div>

  </div>


  <div id="person" class="card">

    <div id="personName"></div>

    <div id="memberNumber"></div>

    <button id="busYes">
      Mit dem Bus gefahren
    </button>

    <button id="busNo">
      Nicht mit dem Bus gefahren
    </button>

  </div>


  <div class="card">

    <div id="status">
      Bereit ...
    </div>

    <button
      id="restartButton"
      style="display:none;">
      Nächsten Scan starten
    </button>

  </div>


  <div id="deviceSettings">

    Gerät:
    <span id="deviceName"></span>

    <button id="changeDevice">
      Gerät ändern
    </button>

  </div>

  <div id="debug"></div>

</div>


<!-- Unsichtbares Canvas -->
<canvas id="canvas" style="display:none;"></canvas>


<!-- Unsichtbares iframe für Apps Script -->
<iframe
  id="submitFrame"
  name="submitFrame"
  style="display:none;">
</iframe>


<script>

  /*
   * ==========================================
   * APPS SCRIPT BACKEND
   * ==========================================
   */

  const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbxOoSLZAGBdLQs1MXeNvsLtgLY0yDi1FxMnx8cCNmTExS-w9SZrl2ylF_tLduIt0M9-zQ/exec";


  /*
   * ==========================================
   * ELEMENTE
   * ==========================================
   */

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");

  const overlay =
    document.getElementById("scanOverlay");

  const cameraMessage =
    document.getElementById("cameraMessage");

  const status =
    document.getElementById("status");

  const debug =
    document.getElementById("debug");


  /*
   * ==========================================
   * VARIABLEN
   * ==========================================
   */

  let stream = null;

  let scanning = false;

  let processingScan = false;

  let currentPerson = null;

  let barcodeDetector = null;

  let zxingReader = null;

  let usingBarcodeDetector = false;

  let zxingControls = null;


  const QUEUE_KEY =
    "busScannerQueue";

  const DEVICE_KEY =
    "busScannerDevice";


  /*
   * ==========================================
   * GERÄT
   * ==========================================
   */

  function getDeviceName() {

    let device =
      localStorage.getItem(DEVICE_KEY);

    if (!device) {

      device = prompt(
        "Wie soll dieses Gerät heißen?\n\n" +
        "Zum Beispiel: Handy 1"
      );

      if (!device || !device.trim()) {
        device = "Unbekannt";
      }

      localStorage.setItem(
        DEVICE_KEY,
        device.trim()
      );
    }

    return device;
  }


  function showDeviceName() {

    document.getElementById(
      "deviceName"
    ).textContent =
      getDeviceName();
  }


  /*
   * ==========================================
   * STATUS
   * ==========================================
   */

  function setStatus(text) {

    status.textContent = text;
  }


  /*
   * ==========================================
   * QR-INHALT AUSWERTEN
   * ==========================================
   */

  function parseQrCode(text) {

    const result = {};

    const parts =
      text.split(";");


    parts.forEach(part => {

      const index =
        part.indexOf("=");

      if (index === -1) {
        return;
      }

      const key =
        part.substring(0, index).trim();

      const value =
        part.substring(index + 1).trim();

      result[key] = value;

    });


    if (!result.Mitgliedsnummer) {

      throw new Error(
        "Keine Mitgliedsnummer im QR-Code."
      );
    }


    return {

      mitgliedsnummer:
        result.Mitgliedsnummer,

      vorname:
        result.Vorname || "",

      nachname:
        result.Nachname || "",

      kuerzel:
        result.Kuerzel || ""

    };
  }


  /*
   * ==========================================
   * ERKANNTEN QR-CODE VERARBEITEN
   * ==========================================
   */

  function handleDetectedText(text) {

    if (
      processingScan ||
      !text
    ) {
      return;
    }


    console.log(
      "QR-Code erkannt:",
      text
    );


    try {

      const person =
        parseQrCode(text);


      processingScan = true;

      scanning = false;

      overlay.classList.add(
        "found"
      );


      stopScanning();


      showPerson(person);


    } catch (error) {

      console.log(
        "QR erkannt, aber Inhalt passt nicht:",
        text
      );

      debug.textContent =
        "QR erkannt – Format wird geprüft ...";
    }
  }


  /*
   * ==========================================
   * PERSON ANZEIGEN
   * ==========================================
   */

  function showPerson(person) {

    currentPerson = person;


    document.getElementById(
      "personName"
    ).textContent =
      (
        person.vorname +
        " " +
        person.nachname
      ).trim();


    document.getElementById(
      "memberNumber"
    ).textContent =
      "Mitgliedsnummer: " +
      person.mitgliedsnummer;


    document.getElementById(
      "person"
    ).style.display =
      "block";


    document.getElementById(
      "cameraBox"
    ).style.display =
      "none";


    cameraMessage.style.display =
      "none";


    setStatus(
      "Bitte Bus-Auswahl treffen."
    );
  }


  /*
   * ==========================================
   * KAMERA
   * ==========================================
   */

  async function startCamera() {

    try {

      cameraMessage.textContent =
        "Kamera wird gestartet ...";


      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


      video.srcObject =
        stream;


      await video.play();


      cameraMessage.textContent =
        "QR-Code vor die Kamera halten";


      setStatus(
        "Scanner bereit."
      );


      await startBarcodeScanner();


    } catch (error) {

      console.error(error);

      cameraMessage.textContent =
        "Kamera konnte nicht gestartet werden.";

      setStatus(
        "Bitte Kamerazugriff erlauben."
      );

    }
  }


  /*
   * ==========================================
   * SCANNER STARTEN
   *
   * 1. BarcodeDetector
   * 2. ZXing als Fallback
   * ==========================================
   */

  async function startBarcodeScanner() {

    /*
     * ----------------------------------------
     * VARIANTE 1: BarcodeDetector
     * ----------------------------------------
     */

    if (
      "BarcodeDetector" in window
    ) {

      try {

        let supportedFormats = [];


        if (
          typeof BarcodeDetector.getSupportedFormats ===
          "function"
        ) {

          supportedFormats =
            await BarcodeDetector.getSupportedFormats();

        }


        if (
          supportedFormats.includes("qr_code")
        ) {

          barcodeDetector =
            new BarcodeDetector({
              formats: ["qr_code"]
            });


          usingBarcodeDetector =
            true;


          debug.textContent =
            "QR-Erkennung: BarcodeDetector";


          scanning = true;


          barcodeDetectorLoop();


          return;

        }

      } catch (error) {

        console.log(
          "BarcodeDetector nicht verfügbar:",
          error
        );

      }
    }


    /*
     * ----------------------------------------
     * VARIANTE 2: ZXing
     * ----------------------------------------
     */

    debug.textContent =
      "QR-Erkennung: ZXing";


    startZXingScanner();
  }


  /*
   * ==========================================
   * BARCODEDETECTOR LOOP
   * ==========================================
   */

  async function barcodeDetectorLoop() {

    if (
      !scanning ||
      !barcodeDetector ||
      processingScan
    ) {
      return;
    }


    try {

      const results =
        await barcodeDetector.detect(
          video
        );


      if (
        results &&
        results.length > 0
      ) {

        const qr =
          results.find(
            item =>
              item.format ===
              "qr_code"
          );


        if (
          qr &&
          qr.rawValue
        ) {

          handleDetectedText(
            qr.rawValue
          );

          return;
        }
      }

    } catch (error) {

      console.log(
        "BarcodeDetector Fehler:",
        error
      );
    }


    if (scanning) {

      requestAnimationFrame(
        barcodeDetectorLoop
      );
    }
  }


  /*
   * ==========================================
   * ZXING FALLBACK
   * ==========================================
   */

  async function startZXingScanner() {

    try {

      if (
        !window.ZXingBrowser
      ) {

        throw new Error(
          "ZXing konnte nicht geladen werden."
        );
      }


      zxingReader =
        new ZXingBrowser.BrowserQRCodeReader();


      scanning = true;


      /*
       * Wir verwenden die bereits geöffnete
       * Kamera.
       */
      zxingControls =
        await zxingReader.decodeFromVideoElement(
          video,
          (result, error) => {

            if (
              result &&
              result.getText()
            ) {

              handleDetectedText(
                result.getText()
              );

            }

          }
        );


    } catch (error) {

      console.error(
        "ZXing Fehler:",
        error
      );


      setStatus(
        "QR-Erkennung konnte nicht gestartet werden."
      );


      debug.textContent =
        "Fehler bei BarcodeDetector und ZXing.";
    }
  }


  /*
   * ==========================================
   * SCANNER STOPPEN
   * ==========================================
   */

  function stopScanning() {

    scanning = false;


    if (
      zxingControls &&
      typeof zxingControls.stop ===
      "function"
    ) {

      try {
        zxingControls.stop();
      } catch (e) {}
    }


    zxingControls = null;
  }


  /*
   * ==========================================
   * WARTESCHLANGE
   * ==========================================
   */

  function getQueue() {

    try {

      return JSON.parse(
        localStorage.getItem(
          QUEUE_KEY
        ) || "[]"
      );

    } catch (error) {

      return [];
    }
  }


  function saveQueue(queue) {

    localStorage.setItem(
      QUEUE_KEY,
      JSON.stringify(queue)
    );
  }


  function addToQueue(data) {

    const queue =
      getQueue();

    queue.push(data);

    saveQueue(queue);
  }


  /*
   * ==========================================
   * AN APPS SCRIPT SENDEN
   * ==========================================
   */

  function sendToBackend(data) {

  return new Promise(resolve => {

    const form =
      document.createElement("form");

    form.method = "POST";
    form.action = BACKEND_URL;
    form.target = "submitFrame";

    form.style.display = "none";


    const fields = {

      mitgliedsnummer:
        data.mitgliedsnummer,

      vorname:
        data.vorname,

      nachname:
        data.nachname,

      kuerzel:
        data.kuerzel,

      bus:
        data.bus,

      geraet:
        data.geraet

    };


    Object.keys(fields).forEach(key => {

      const input =
        document.createElement("input");

      input.type = "hidden";
      input.name = key;
      input.value = fields[key] || "";

      form.appendChild(input);

    });


    const requestId =
      data.id;


    window.pendingRequest =
      requestId;

    window.pendingResolve =
      resolve;


    document.body.appendChild(form);

    form.submit();


    /*
     * Formular erst nach dem Absenden
     * aus dem Dokument entfernen.
     */

    setTimeout(() => {

      if (form.parentNode) {
        form.parentNode.removeChild(form);
      }

    }, 100);


    /*
     * Falls Apps Script nicht antwortet,
     * nach 15 Sekunden als fehlgeschlagen
     * behandeln.
     */

    setTimeout(() => {

      if (
        window.pendingRequest ===
        requestId
      ) {

        window.pendingRequest = null;
        window.pendingResolve = null;

        resolve({
          success: false,
          timeout: true
        });

      }

    }, 15000);

  });

}


  /*
   * ==========================================
   * APPS SCRIPT ANTWORT
   * ==========================================
   */

  window.addEventListener(
    "message",
    function(event) {

      if (
        !event.data ||
        event.data.type !==
        "busScannerResult"
      ) {
        return;
      }


      if (
        !window.pendingResolve
      ) {
        return;
      }


      const resolve =
        window.pendingResolve;


      window.pendingResolve =
        null;

      window.pendingRequest =
        null;


      resolve(
        event.data.data
      );

    }
  );


  /*
   * ==========================================
   * WARTESCHLANGE ÜBERTRAGEN
   * ==========================================
   */

  async function flushQueue() {

    if (!navigator.onLine) {
      return;
    }


    let queue =
      getQueue();


    if (
      queue.length === 0
    ) {
      return;
    }


    setStatus(
      "Gespeicherte Scans werden übertragen ..."
    );


    while (
      queue.length > 0
    ) {

      const item =
        queue[0];


      const result =
        await sendToBackend(
          item
        );


      if (
        result.success ||
        result.duplicate
      ) {

        queue.shift();

        saveQueue(queue);

      } else {

        break;
      }
    }


    if (
      queue.length === 0
    ) {

      setStatus(
        "Alle Scans übertragen."
      );

    } else {

      setStatus(
        queue.length +
        " Scan(s) warten auf Übertragung."
      );
    }
  }


  /*
   * ==========================================
   * BUS-AUSWAHL
   * ==========================================
   */

  async function saveCurrentScan(
    busValue
  ) {

    if (!currentPerson) {
      return;
    }


    const data = {

      id:
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2),

      mitgliedsnummer:
        currentPerson.mitgliedsnummer,

      vorname:
        currentPerson.vorname,

      nachname:
        currentPerson.nachname,

      kuerzel:
        currentPerson.kuerzel,

      bus:
        busValue,

      geraet:
        getDeviceName()

    };


    /*
     * Zuerst lokal speichern.
     */
    addToQueue(data);


    document.getElementById(
      "person"
    ).style.display =
      "none";


    document.getElementById(
      "cameraBox"
    ).style.display =
      "block";


    cameraMessage.style.display =
      "block";


    currentPerson = null;

    processingScan = false;


    overlay.classList.remove(
      "found"
    );


    if (!navigator.onLine) {

      setStatus(
        "Offline gespeichert. " +
        "Wird später übertragen."
      );


      await restartScanning();

      return;
    }


    await flushQueue();


    await restartScanning();
  }


  /*
   * ==========================================
   * SCANNER NEU STARTEN
   * ==========================================
   */

  async function restartScanning() {

    scanning = true;


    setStatus(
      "Bereit für den nächsten Scan."
    );


    if (
      usingBarcodeDetector &&
      barcodeDetector
    ) {

      requestAnimationFrame(
        barcodeDetectorLoop
      );

    } else {

      await startZXingScanner();

    }
  }


  /*
   * ==========================================
   * BUTTONS
   * ==========================================
   */

  document.getElementById(
    "busYes"
  ).addEventListener(
    "click",
    function() {

      saveCurrentScan("Ja");

    }
  );


  document.getElementById(
    "busNo"
  ).addEventListener(
    "click",
    function() {

      saveCurrentScan("Nein");

    }
  );


  /*
   * ==========================================
   * GERÄT ÄNDERN
   * ==========================================
   */

  document.getElementById(
    "changeDevice"
  ).addEventListener(
    "click",
    function() {

      const newName =
        prompt(
          "Name dieses Geräts:",
          getDeviceName()
        );


      if (
        newName &&
        newName.trim()
      ) {

        localStorage.setItem(
          DEVICE_KEY,
          newName.trim()
        );


        showDeviceName();

      }

    }
  );


  /*
   * ==========================================
   * INTERNET
   * ==========================================
   */

  window.addEventListener(
    "online",
    function() {

      document.getElementById(
        "offlineInfo"
      ).style.display =
        "none";


      setStatus(
        "Internet wieder verfügbar."
      );


      flushQueue();

    }
  );


  window.addEventListener(
    "offline",
    function() {

      document.getElementById(
        "offlineInfo"
      ).style.display =
        "block";


      setStatus(
        "Offline – Scans werden gespeichert."
      );

    }
  );


  /*
   * ==========================================
   * START
   * ==========================================
   */

  showDeviceName();


  if (!navigator.onLine) {

    document.getElementById(
      "offlineInfo"
    ).style.display =
      "block";
  }


  flushQueue();


  startCamera();

</script>

</body>
</html>
