    #busNo {

      color: white;
    }

    #changeDevice {
      background: #ddd;
      color: #222;
      font-size: 14px;
      padding: 10px;
    }

    #status {
      text-align: center;
      font-weight: bold;
      min-height: 24px;
    }

    #debug {
      margin-top: 10px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }

    #device {
      text-align: center;
      color: #666;
      font-size: 14px;
    }

  </style>

</head>

<div class="container">

    <button id="changeDevice">
      Gerät ändern
    </button>

  <div id="debug"></div>


</div>

function getDeviceName() {

  let name =
    localStorage.getItem(
      "busScannerDevice"
    );


  if (!name) {

    name =
      prompt(
        "Name dieses Geräts:",
        "Handy 1"
      );


    if (
      !name ||
      !name.trim()
    ) {

      name = "Unbekannt";

    }


    localStorage.setItem(
      "busScannerDevice",
      name.trim()
    );

  }


  return name;

}


function showDeviceName() {

  document.getElementById(
    "deviceName"
  ).textContent =
    getDeviceName();

}


/*
==================================================
QR CODE PARSEN
==================================================
*/

function parseQrCode(text) {

  const result = {};


  text
    .split(";")
    .forEach(function(part) {

      const index =
        part.indexOf("=");


      if (index === -1) {
        return;
      }


      const key =
        part
          .substring(0, index)
          .trim();


      const value =
        part
          .substring(index + 1)
          .trim();


      result[key] = value;

    });


  if (
    !result.Mitgliedsnummer
  ) {

    throw new Error(
      "Mitgliedsnummer fehlt."
    );

  }


  return {

    mitgliedsnummer:
      result.Mitgliedsnummer,

    vorname:
      result.Vorname || "",

    nachname:
      result.Nachname || "",

    kuerzel:
      result.Kuerzel || ""

  };

}


/*
==================================================
QR ERKANNT
==================================================
*/

function qrDetected(text) {

  if (
    processing ||
    !text
  ) {

    return;

  }


  console.log(
    "QR erkannt:",
    text
  );


  try {

    const person =
      parseQrCode(text);


    processing = true;

    scanning = false;


    stopScanner();


    overlay.classList.add(
      "found"
    );


    showPerson(person);


  } catch (error) {

    debug.textContent =
      "QR erkannt, aber Format unbekannt.";

    console.log(
      error
    );

  }

}


/*

PERSON ANZEIGEN
==================================================

function showPerson(person) {

  currentPerson =
    person;


  document.getElementById(
    "personName"
  ).textContent =
    (
      person.vorname +
      " " +
      person.nachname
    ).trim();


  document.getElementById(
    "memberNumber"
  ).textContent =
    "Mitgliedsnummer: " +
    person.mitgliedsnummer;


  personBox.style.display =
    "block";


  document.getElementById(
    "cameraBox"
  ).style.display =
    "none";


  cameraMessage.style.display =
    "none";


  setStatus(
    "Bitte Bus-Auswahl treffen."
  );

}
