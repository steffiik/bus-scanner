<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Bus-Scanner</title>

  <!-- QR-Erkennung -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 8px 0 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    #cameraBox {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: black;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
    }

    #scanOverlay {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 70%;
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      border: 4px solid #888;
      border-radius: 12px;
      pointer-events: none;
      transition: border-color 0.15s;
    }

    #scanOverlay.scanning {
      border-color: #777;
    }

    #scanOverlay.found {
      border-color: #198754;
    }

    #cameraMessage {
      text-align: center;
      padding: 12px;
      font-weight: bold;
    }

    #person {
      display: none;
    }

    #personName {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #memberNumber {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 18px;
      margin-top: 12px;
      font-size: 19px;
      font-weight: bold;
    }

    #busYes {
      background: #198754;
      color: white;
    }

    #busNo {
      background: #dc3545;
      color: white;
    }

    #restartButton {
      background: #444;
      color: white;
    }

    #changeDevice {
      background: #ddd;
      color: #222;
      font-size: 14px;
      padding: 10px;
    }

    #status {
      text-align: center;
      font-weight: bold;
      min-height: 24px;
    }

    #offlineInfo {
      display: none;
      background: #fff3cd;
      color: #664d03;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      margin-bottom: 12px;
    }

    #deviceSettings {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 12px;
    }

    #canvas {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚌 Bus-Scanner</h1>

  <div id="offlineInfo">
    Keine Internetverbindung.<br>
    Die Erfassung wird gespeichert und später übertragen.
  </div>

  <div class="card">

    <div id="cameraBox">

      <video
        id="video"
        playsinline
        autoplay
        muted>
      </video>

      <div id="scanOverlay"></div>

    </div>

    <div id="cameraMessage">
      Kamera wird gestartet ...
    </div>

  </div>


  <div id="person" class="card">

    <div id="personName"></div>

    <div id="memberNumber"></div>

    <button id="busYes">
      Mit dem Bus gefahren
    </button>

    <button id="busNo">
      Nicht mit dem Bus gefahren
    </button>

  </div>


  <div class="card">

    <div id="status">
      Bereit ...
    </div>

    <button
      id="restartButton"
      style="display:none;">
      Nächsten Scan starten
    </button>

  </div>


  <div id="deviceSettings">

    Gerät:
    <span id="deviceName"></span>

    <button id="changeDevice">
      Gerät ändern
    </button>

  </div>

</div>


<canvas id="canvas"></canvas>


<!-- Unsichtbarer Bereich für Apps Script -->
<iframe
  id="submitFrame"
  name="submitFrame"
  style="display:none;">
</iframe>


<script>

  /*
   * DEINE APPS-SCRIPT-WEB-APP
   */
  const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbxOoSLZAGBdLQs1MXeNvsLtgLY0yDi1FxMnx8cCNmTExS-w9SZrl2ylF_tLduIt0M9-zQ/exec";


  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d", {
      willReadFrequently: true
    });

  const overlay =
    document.getElementById("scanOverlay");

  const cameraMessage =
    document.getElementById("cameraMessage");

  const status =
    document.getElementById("status");

  let cameraStream = null;

  let scanning = false;

  let currentPerson = null;

  let processingScan = false;


  const QUEUE_KEY =
    "busScannerQueue";

  const DEVICE_KEY =
    "busScannerDevice";


  /*
   * -----------------------------------------
   * Gerät
   * -----------------------------------------
   */

  function getDeviceName() {

    let device =
      localStorage.getItem(DEVICE_KEY);

    if (!device) {

      device = prompt(
        "Wie soll dieses Gerät heißen?\n\n" +
        "Zum Beispiel: Handy 1"
      );

      if (!device || !device.trim()) {
        device = "Unbekannt";
      }

      localStorage.setItem(
        DEVICE_KEY,
        device.trim()
      );
    }

    return device;
  }


  function showDeviceName() {

    document.getElementById(
      "deviceName"
    ).textContent =
      getDeviceName();
  }


  /*
   * -----------------------------------------
   * Status
   * -----------------------------------------
   */

  function setStatus(text) {

    status.textContent = text;
  }


  /*
   * -----------------------------------------
   * QR-Code auslesen
   * -----------------------------------------
   */

  function parseQrCode(text) {

    const result = {};

    const parts =
      text.split(";");


    parts.forEach(part => {

      const index =
        part.indexOf("=");

      if (index === -1) {
        return;
      }

      const key =
        part
          .substring(0, index)
          .trim();

      const value =
        part
          .substring(index + 1)
          .trim();

      result[key] = value;

    });


    if (!result.Mitgliedsnummer) {

      throw new Error(
        "Keine Mitgliedsnummer gefunden."
      );
    }


    return {

      mitgliedsnummer:
        result.Mitgliedsnummer,

      vorname:
        result.Vorname || "",

      nachname:
        result.Nachname || "",

      kuerzel:
        result.Kuerzel || ""

    };
  }


  /*
   * -----------------------------------------
   * Person anzeigen
   * -----------------------------------------
   */

  function showPerson(person) {

    currentPerson = person;

    document.getElementById(
      "personName"
    ).textContent =
      person.vorname +
      " " +
      person.nachname;


    document.getElementById(
      "memberNumber"
    ).textContent =
      "Mitgliedsnummer: " +
      person.mitgliedsnummer;


    document.getElementById(
      "person"
    ).style.display =
      "block";


    document.getElementById(
      "cameraBox"
    ).style.display =
      "none";


    document.getElementById(
      "cameraMessage"
    ).style.display =
      "none";


    setStatus(
      "Bitte Bus-Auswahl treffen."
    );
  }


  /*
   * -----------------------------------------
   * Kamera starten
   * -----------------------------------------
   */

  async function startCamera() {

    try {

      cameraMessage.textContent =
        "Kamera wird gestartet ...";


      cameraStream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


      video.srcObject =
        cameraStream;


      await video.play();


      cameraMessage.textContent =
        "QR-Code vor die Kamera halten";


      setStatus(
        "Bereit für den nächsten Scan."
      );


      scanning = true;


      requestAnimationFrame(
        scanFrame
      );


    } catch (error) {

      console.error(error);

      cameraMessage.textContent =
        "Kamera konnte nicht gestartet werden.";

      setStatus(
        "Bitte Kamerazugriff erlauben."
      );
    }
  }


  /*
   * -----------------------------------------
   * QR-Code suchen
   * -----------------------------------------
   */

  function scanFrame() {

    if (!scanning) {
      return;
    }


    if (
      video.readyState ===
      video.HAVE_ENOUGH_DATA
    ) {

      const width =
        video.videoWidth;

      const height =
        video.videoHeight;


      if (width > 0 && height > 0) {

        canvas.width = width;
        canvas.height = height;


        ctx.drawImage(
          video,
          0,
          0,
          width,
          height
        );


        const imageData =
          ctx.getImageData(
            0,
            0,
            width,
            height
          );


        const code =
          jsQR(
            imageData.data,
            imageData.width,
            imageData.height,
            {
              inversionAttempts:
                "attemptBoth"
            }
          );


        if (
          code &&
          code.data &&
          !processingScan
        ) {

          processingScan = true;

          overlay.classList.add(
            "found"
          );


          try {

            const person =
              parseQrCode(
                code.data
              );


            scanning = false;

            showPerson(person);


          } catch (error) {

            console.log(
              "QR erkannt, aber Inhalt ungültig:",
              code.data
            );

            processingScan = false;

          }

        }
      }
    }


    requestAnimationFrame(
      scanFrame
    );
  }


  /*
   * -----------------------------------------
   * Warteschlange
   * -----------------------------------------
   */

  function getQueue() {

    try {

      return JSON.parse(
        localStorage.getItem(
          QUEUE_KEY
        ) || "[]"
      );

    } catch (error) {

      return [];
    }
  }


  function saveQueue(queue) {

    localStorage.setItem(
      QUEUE_KEY,
      JSON.stringify(queue)
    );
  }


  function addToQueue(data) {

    const queue =
      getQueue();

    queue.push(data);

    saveQueue(queue);
  }


  /*
   * -----------------------------------------
   * Apps Script übertragen
   * -----------------------------------------
   */

  function sendToBackend(data) {

    return new Promise(resolve => {

      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";

      form.action =
        BACKEND_URL;

      form.target =
        "submitFrame";

      form.style.display =
        "none";


      const fields = {

        mitgliedsnummer:
          data.mitgliedsnummer,

        vorname:
          data.vorname,

        nachname:
          data.nachname,

        kuerzel:
          data.kuerzel,

        bus:
          data.bus,

        geraet:
          data.geraet
      };


      Object.keys(fields)
        .forEach(key => {

          const input =
            document.createElement(
              "input"
            );

          input.type =
            "hidden";

          input.name =
            key;

          input.value =
            fields[key] || "";

          form.appendChild(input);

        });


      const requestId =
        data.id;


      window.pendingRequest =
        requestId;

      window.pendingResolve =
        resolve;


      document.body.appendChild(
        form
      );


      form.submit();


      form.remove();


      setTimeout(() => {

        if (
          window.pendingRequest ===
          requestId
        ) {

          window.pendingRequest =
            null;

          window.pendingResolve =
            null;


          resolve({

            success: false,

            timeout: true

          });

        }

      }, 15000);

    });
  }


  /*
   * Antwort von Apps Script
   */

  window.addEventListener(
    "message",
    function(event) {

      if (
        !event.data ||
        event.data.type !==
        "busScannerResult"
      ) {
        return;
      }


      if (
        !window.pendingResolve
      ) {
        return;
      }


      const resolve =
        window.pendingResolve;


      window.pendingResolve =
        null;

      window.pendingRequest =
        null;


      resolve(
        event.data.data
      );

    }
  );


  /*
   * -----------------------------------------
   * Warteschlange übertragen
   * -----------------------------------------
   */

  async function flushQueue() {

    if (!navigator.onLine) {
      return;
    }


    let queue =
      getQueue();


    if (queue.length === 0) {
      return;
    }


    setStatus(
      "Gespeicherte Scans werden übertragen ..."
    );


    while (
      queue.length > 0
    ) {

      const item =
        queue[0];


      const result =
        await sendToBackend(
          item
        );


      if (
        result.success ||
        result.duplicate
      ) {

        queue.shift();

        saveQueue(queue);


      } else {

        break;
      }
    }


    if (
      queue.length === 0
    ) {

      setStatus(
        "Alle Scans übertragen."
      );

    } else {

      setStatus(
        queue.length +
        " Scan(s) warten auf Übertragung."
      );
    }
  }


  /*
   * -----------------------------------------
   * Bus-Auswahl
   * -----------------------------------------
   */

  async function saveCurrentScan(
    busValue
  ) {

    if (!currentPerson) {
      return;
    }


    const data = {

      id:
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2),

      mitgliedsnummer:
        currentPerson.mitgliedsnummer,

      vorname:
        currentPerson.vorname,

      nachname:
        currentPerson.nachname,

      kuerzel:
        currentPerson.kuerzel,

      bus:
        busValue,

      geraet:
        getDeviceName()

    };


    /*
     * Sofort lokal speichern.
     */
    addToQueue(data);


    /*
     * Person ausblenden.
     */

    document.getElementById(
      "person"
    ).style.display =
      "none";


    document.getElementById(
      "cameraBox"
    ).style.display =
      "block";


    document.getElementById(
      "cameraMessage"
    ).style.display =
      "block";


    currentPerson = null;

    processingScan = false;

    overlay.classList.remove(
      "found"
    );


    if (!navigator.onLine) {

      setStatus(
        "Offline gespeichert. " +
        "Wird später übertragen."
      );


      scanning = true;

      requestAnimationFrame(
        scanFrame
      );

      return;
    }


    await flushQueue();


    scanning = true;

    requestAnimationFrame(
      scanFrame
    );
  }


  /*
   * -----------------------------------------
   * Buttons
   * -----------------------------------------
   */

  document.getElementById(
    "busYes"
  ).addEventListener(
    "click",
    function() {

      saveCurrentScan("Ja");

    }
  );


  document.getElementById(
    "busNo"
  ).addEventListener(
    "click",
    function() {

      saveCurrentScan("Nein");

    }
  );


  /*
   * -----------------------------------------
   * Gerät ändern
   * -----------------------------------------
   */

  document.getElementById(
    "changeDevice"
  ).addEventListener(
    "click",
    function() {

      const newName =
        prompt(
          "Name dieses Geräts:",
          getDeviceName()
        );


      if (
        newName &&
        newName.trim()
      ) {

        localStorage.setItem(
          DEVICE_KEY,
          newName.trim()
        );


        showDeviceName();
      }

    }
  );


  /*
   * -----------------------------------------
   * Internet
   * -----------------------------------------
   */

  window.addEventListener(
    "online",
    function() {

      document.getElementById(
        "offlineInfo"
      ).style.display =
        "none";


      setStatus(
        "Internet wieder verfügbar."
      );


      flushQueue();

    }
  );


  window.addEventListener(
    "offline",
    function() {

      document.getElementById(
        "offlineInfo"
      ).style.display =
        "block";


      setStatus(
        "Offline – Scans werden gespeichert."
      );

    }
  );


  /*
   * -----------------------------------------
   * Start
   * -----------------------------------------
   */

  showDeviceName();


  if (!navigator.onLine) {

    document.getElementById(
      "offlineInfo"
    ).style.display =
      "block";
  }


  flushQueue();


  startCamera();

</script>

</body>
</html>
